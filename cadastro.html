<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cadastro</title>
    <script src="resources/scripts/cadastro.js" defer type="module"></script>

</head>
<body>
    <form action="submit" id="formularioCadastro">
        <div>
            <label for="name">
               Nome <input id="nome" type="text" name="name" required maxlength="30" pattern="[A-Za-zÀ-ÿ]+( [A-Za-zÀ-ÿ]+)*">
            </label>
        </div>
        <div>
            <label for="CPF">
                CPF<input id="CPF" type="number" name="cpf" required maxlength="11" minlength="11" pattern="[A-Za-zÀ-ÿ]+( [A-Za-zÀ-ÿ]+)*">
            </label>
        </div>
        <div>
            <label for="email">
                Email<input id="email" type="email" name="email" required>
            </label>
        </div>
        <div>
            <label for="password">
                Password<input id="password" type="password" name="password" required >
            </label>
        </div>
        <button type="submit">Click</button>
    </form>
</body>
</html>
